$kind: http-request
description: "owner/adminのみ。本人の申請を自己承認可。同卓で同じ本人が重複するなら409。"
url: "{{base_url}}/api/leagues/{{league_id}}/participant-links/{{link_id}}/approve"
method: POST
headers:
  Authorization: "Bearer {{access_token}}"
  Content-Type: application/json
body:
  type: json
  content: |
    {
      "confirmation_note": "対局した本人であることを確認",
      "version": "{{link_version}}",
      "client_request_id": "{{client_request_id}}"
    }
order: 31000
