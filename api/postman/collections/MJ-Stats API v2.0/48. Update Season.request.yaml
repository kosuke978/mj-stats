$kind: http-request
description: "運営のみ。名前だけの更新は期間を維持。片方の日付を送ると既存のもう片方と検証し、nullを送った日付だけを解除。使用済みの期間の変更・解除と版競合は409。同じ操作ID・本文の再送は200。"
url: "{{base_url}}/api/leagues/{{league_id}}/seasons/{{season_id}}"
method: PATCH
headers:
  Authorization: "Bearer {{access_token}}"
  Content-Type: application/json
body:
  type: json
  content: |
    {
      "client_request_id": "{{client_request_id}}",
      "version": "{{object_version}}",
      "name": "更新したシーズン"
    }
order: 49000
