# Isolated local acceptance stack. Never link this project to a hosted project.
project_id = "mj-stats-step1"
[api]
enabled = true
port = 55421
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 55422
shadow_port = 55420
major_version = 17
[db.seed]
enabled = false
[realtime]
enabled = false
[studio]
enabled = false
[local_smtp]
enabled = true
port = 55424
[storage]
enabled = false
[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/confirm"]
jwt_expiry = 3600
signing_keys_path = "./signing_keys.json"
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8
[auth.email]
enabled = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1s"
otp_expiry = 3600
[auth.email.template.confirmation]
subject = "MJ-Stats 登録の確認"
content_path = "./supabase/templates/confirmation.html"
[auth.email.template.recovery]
subject = "MJ-Stats パスワードの再設定"
content_path = "./supabase/templates/recovery.html"
[edge_runtime]
enabled = false
[analytics]
enabled = false
