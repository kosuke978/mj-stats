# Copy into .local/managed-project/supabase/config.toml for the dedicated QA only.
# Configure a test SMTP provider in Dashboard first. No SMTP secrets belong here.
project_id = "mj-stats-step1-qa"
[auth]
enabled = true
site_url = "http://localhost:3001"
additional_redirect_urls = ["http://localhost:3001/auth/confirm"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8
[auth.email]
enabled = true
enable_confirmations = true
secure_password_change = true
otp_expiry = 3600
[auth.email.template.confirmation]
subject = "MJ-Stats 登録の確認"
content_path = "./supabase/templates/confirmation.html"
[auth.email.template.recovery]
subject = "MJ-Stats パスワードの再設定"
content_path = "./supabase/templates/recovery.html"
